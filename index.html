<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>muse Sync Test</title><style>body{margin:0;background:#141522;color:#f6f2fa;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:24px 18px}h1{font-size:25px}.sub{color:#b7afc6;font-size:13px}.art{height:260px;border-radius:18px;background:linear-gradient(135deg,#443252,#222e4b);display:grid;place-content:center;text-align:center;margin:22px 0}.art strong{font-size:40px}.art span{margin-top:10px}button{background:#7761b3;border:0;color:white;border-radius:12px;padding:13px 20px;font-size:16px}button:disabled{opacity:.4}input[type=range]{width:100%}input[type=file]{max-width:100%}.panel{padding:17px;background:#232437;border-radius:16px;margin:14px 0}.controls{display:flex;justify-content:center;gap:10px}.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}#status{overflow-wrap:anywhere;font-size:13px;color:#e9c8a4}</style></head><body><main><h1>muse ♡ SYNC TEST</h1><div class="sub">iPhone / Safari 対応テストプレイヤー v3</div><div class="art" id="art"><strong id="cg">CG 01</strong><span id="note">仮CG・音声待機中</span></div><section class="panel"><label for="file">① iPhoneから音声ファイルを選択</label><p><input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav"></p><div id="filename" class="sub">未選択</div></section><section class="panel"><div class="time"><span id="now">00:00</span><span id="duration">00:00</span></div><input id="seek" type="range" min="0" max="1000" value="0"><div class="controls"><button id="back" disabled>−10秒</button><button id="play" disabled>▶ 再生</button><button id="forward" disabled>＋10秒</button></div><p id="status">音声を選択してください。</p></section><section class="panel"><b>② CG同期の確認</b><p class="sub">0〜9秒：CG 01 / 10〜19秒：CG 02 / 20秒以降：CG 03</p><p class="sub">一時停止・シークしても現在の再生秒数からCGを決定します。</p></section><audio id="audio" preload="metadata" playsinline></audio><p class="sub">音声はこの端末内で読み込みます。外部送信するプログラムは含みません。解析タグ・外部ライブラリなし。</p></main><script>'use strict';const el=id=>document.getElementById(id),audio=el('audio');let objectUrl=null;function clock(n){if(!Number.isFinite(n))return '00:00';return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}function update(){let t=audio.currentTime||0,d=audio.duration;el('now').textContent=clock(t);el('duration').textContent=clock(d);el('seek').value=Number.isFinite(d)&&d>0?Math.round(t/d*1000):0;let n=t<10?1:t<20?2:3;el('cg').textContent='CG 0'+n;el('note').textContent='再生位置 '+clock(t);el('art').style.background=['','linear-gradient(135deg,#443252,#222e4b)','linear-gradient(135deg,#245b71,#253354)','linear-gradient(135deg,#795034,#52315c)'][n];el('play').textContent=audio.paused?'▶ 再生':'Ⅱ 一時停止'}el('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;audio.pause();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.src=objectUrl;audio.load();el('filename').textContent=f.name;el('status').textContent='読み込み中…';for(const id of ['play','back','forward'])el(id).disabled=false;update()});el('play').addEventListener('click',async()=>{try{if(audio.paused){await audio.play();el('status').textContent='再生中'}else{audio.pause();el('status').textContent='一時停止'}}catch(e){el('status').textContent='再生エラー: '+e.name+' / '+e.message}update()});el('back').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-10);update()};el('forward').onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+10);update()};el('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/1000;update()};audio.addEventListener('loadedmetadata',()=>{el('status').textContent='読み込み完了。再生ボタンを押してください。';update()});audio.addEventListener('timeupdate',update);audio.addEventListener('pause',update);audio.addEventListener('play',update);audio.addEventListener('ended',()=>{el('status').textContent='再生終了';update()});audio.addEventListener('error',()=>{el('status').textContent='音声を読み込めません（エラーコード '+(audio.error?.code||'?')+'）'});</script></body></html>
